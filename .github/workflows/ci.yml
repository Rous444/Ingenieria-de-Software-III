name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # para que main tenga su corrida (la que lee el badge)

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # TP6: permiso para publicar en ghcr.io, declarado EN EL JOB (mínimo privilegio:
    # a nivel workflow se lo daría a todos los jobs). Lo que no se lista queda sin
    # permiso: por eso va también contents: read, que es el que usa el checkout.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v3

      # ── TP5: tests con cobertura, en la etapa `test` del mismo Dockerfile ──
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test          # se detiene en la etapa de tests, no llega a la final
          load: true            # la baja al Docker local: sin esto el docker run no la encuentra
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # Si un test falla o la cobertura no llega al umbral, vitest sale con error,
      # el docker run devuelve ese error y el job se pone en rojo. Como el job es
      # un required check de main (TP4), el merge queda bloqueado.
      - name: Correr los tests del backend con cobertura (y umbral)
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen de cobertura del backend
        if: ${{ !cancelled() }}      # también cuando el umbral falló: es la corrida que más importa ver
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"                  # si no está el archivo, mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].covered}/\${t[m].total} | \${t[m].pct}% |\`;
            console.log('### Cobertura del backend');
            console.log('| métrica | cubiertas/total | % |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el reporte de cobertura del backend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # ── TP6: el cierre del CI, publicar el artefacto ─────────────────────────
      # Estos dos pasos van ÚLTIMOS a propósito, y no llevan !cancelled(): si
      # cualquier paso anterior falló (build, tests, umbral), el job ya murió y
      # nunca se llega acá. La condición "sólo si la verificación pasó" no está
      # escrita en un if: está en el ORDEN de los pasos.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token de la corrida: no hay secret que guardar

      # Construye la imagen final (la de producción, sin target) y la publica
      # SÓLO en un push a main: en un PR construye igual (verifica que el
      # Dockerfile anda) pero no sube nada. Las dos condiciones, no una: si
      # mañana el workflow escucha otra rama, un push ahí no publica.
      # El nombre va a mano y en minúsculas: ghcr.io no acepta mayúsculas y
      # github.repository es "Rous444/Ingenieria-de-Software-III".
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/rous444/ingenieria-de-software-iii-backend:sha-${{ github.sha }}
          # TP7: el commit queda HORNEADO en la imagen (ARG GIT_SHA del Dockerfile) y
          # /health lo devuelve. Así el smoke compara contra el commit de la corrida y
          # se entera desde afuera si el entorno levantó ESTA imagen o sigue con la vieja.
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # TP6: permiso para publicar en ghcr.io, declarado EN EL JOB (mínimo privilegio:
    # a nivel workflow se lo daría a todos los jobs). Lo que no se lista queda sin
    # permiso: por eso va también contents: read, que es el que usa el checkout.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v3

      # ── TP5: tests con cobertura, en la etapa `test` del mismo Dockerfile ──
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: test          # se detiene en la etapa de tests, no llega a la final
          load: true            # la baja al Docker local: sin esto el docker run no la encuentra
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # Si un test falla o la cobertura no llega al umbral, vitest sale con error,
      # el docker run devuelve ese error y el job se pone en rojo. Como el job es
      # un required check de main (TP4), el merge queda bloqueado.
      - name: Correr los tests del frontend con cobertura (y umbral)
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen de cobertura del frontend
        if: ${{ !cancelled() }}      # también cuando el umbral falló: es la corrida que más importa ver
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"                  # si no está el archivo, mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].covered}/\${t[m].total} | \${t[m].pct}% |\`;
            console.log('### Cobertura del frontend');
            console.log('| métrica | cubiertas/total | % |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el reporte de cobertura del frontend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ── TP6: el cierre del CI, publicar el artefacto ─────────────────────────
      # Estos dos pasos van ÚLTIMOS a propósito, y no llevan !cancelled(): si
      # cualquier paso anterior falló (build, tests, umbral), el job ya murió y
      # nunca se llega acá. La condición "sólo si la verificación pasó" no está
      # escrita en un if: está en el ORDEN de los pasos.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token de la corrida: no hay secret que guardar

      # Construye la imagen final (la de producción, sin target) y la publica
      # SÓLO en un push a main: en un PR construye igual (verifica que el
      # Dockerfile anda) pero no sube nada. Las dos condiciones, no una: si
      # mañana el workflow escucha otra rama, un push ahí no publica.
      # El nombre va a mano y en minúsculas: ghcr.io no acepta mayúsculas y
      # github.repository es "Rous444/Ingenieria-de-Software-III".
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/rous444/ingenieria-de-software-iii-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── TP6: la promoción. Arranca donde termina la verificación ──────────────────
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde (build + tests + umbral) no hay deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # los PRs verifican; sólo main despliega
    environment: qa                            # hereda los secrets y variables de qa, y suma al historial
    timeout-minutes: 20
    permissions:
      contents: read
    # TP7: las URLs de QA viven en las variables del environment qa (las del TP6),
    # y un job sólo las lee si declara ese environment. Los jobs de prueba no lo
    # declaran (no despliegan nada), así que deploy-qa se las pasa como salidas:
    # una sola fuente de verdad, nada escrito dos veces.
    outputs:
      url_api: ${{ steps.urls.outputs.api }}
      url_front: ${{ steps.urls.outputs.front }}
    steps:
      # TP7: el hook deja de decir QUÉ COMMIT CONSTRUIR y pasa a decir QUÉ IMAGEN
      # EJECUTAR. Los servicios de Render son "Existing Image": no compilan nada,
      # bajan de ghcr.io la imagen que les nombra imgURL. Es la misma que publicaron
      # los dos jobs de build de ESTA corrida, con su etiqueta sha-<commit completo>.
      # Por eso el &ref= se fue: con una imagen no hay nada que construir.
      #
      # --get --data-urlencode agrega imgURL a la URL del hook (que ya trae ?key=...)
      # con su '&' y codifica los ':' y '/' de la imagen. La URL va ÚLTIMA: es el
      # único argumento suelto. Si la etiqueta no existe, o el nombre de la imagen
      # no es el configurado en el servicio, Render contesta 400 y el -f pone el
      # job en rojo.
      - name: Desplegar en QA la IMAGEN de este commit (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMG_API: ghcr.io/rous444/ingenieria-de-software-iii-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/rous444/ingenieria-de-software-iii-frontend:sha-${{ github.sha }}
        run: |
          echo "imgURL api:   $IMG_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Bajar el script del smoke test
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Smoke test de QA (espera a que conteste la imagen de ESTE commit)
        shell: bash
        env:
          ENTORNO: qa
          URL_API: ${{ vars.URL_API }}         # variables del environment qa (no son secretas)
          URL_FRONT: ${{ vars.URL_FRONT }}
          COMMIT: ${{ github.sha }}
        run: .github/scripts/smoke.sh

      - name: Pasarle las URLs de QA a los jobs de prueba
        id: urls
        env:
          URL_API: ${{ vars.URL_API }}
          URL_FRONT: ${{ vars.URL_FRONT }}
        run: |
          echo "api=$URL_API" >> "$GITHUB_OUTPUT"
          echo "front=$URL_FRONT" >> "$GITHUB_OUTPUT"

  # ── TP7: las pruebas contra QA, como gate de promoción ─────────────────────────
  # Corren contra QA, que a esta altura ya ejecuta la IMAGEN de esta corrida (el
  # smoke de deploy-qa lo comprobó con el commit de /health). En orden de costo:
  # primero la integración (pedidos HTTP, segundos, sin navegador); si la api o la
  # base están rotas, la e2e ni arranca. Después la e2e (un Chromium, minutos).
  #
  # 🔴 El gate tiene que poder decir que no: en este tramo no hay continue-on-error,
  # ni "|| true", ni if: always(). Los únicos !cancelled() son los de los pasos que
  # PUBLICAN el reporte, que importa más cuando algo falló.
  # En un PR, deploy-qa no corre, y por eso estos dos jobs (y deploy-prod) salen
  # salteados: un job cuya dependencia se salteó, se saltea.
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                           # QA ya ejecuta la imagen de ESTA corrida
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (sin navegador)
        run: npm ci                            # sin "playwright install": estas pruebas no abren navegador
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: ${{ needs.deploy-qa.outputs.url_api }}   # la API, no el front
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Resumen de la integración
        if: ${{ !cancelled() }}
        run: node .github/scripts/resumen-playwright.js "Integración contra la api de QA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de integración
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion  # distinto del de e2e: dos con el mismo nombre rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    # El gate del medio: sin integración verde no se gasta un navegador en
    # confirmar que la api está rota. deploy-qa figura sólo para leer sus salidas
    # (la URL del front de QA): integracion ya depende de él.
    needs: [deploy-qa, integracion]
    timeout-minutes: 20                        # si algo se cuelga, el job muere en vez de esperar horas
    permissions:
      contents: read
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y el navegador
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra el front de QA
        env:
          E2E_BASE_URL: ${{ needs.deploy-qa.outputs.url_front }}   # el FRONT de QA
        run: npx playwright test e2e/animales.spec.js   # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Resumen de las e2e
        if: ${{ !cancelled() }}
        run: node .github/scripts/resumen-playwright.js "e2e contra el front de QA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte e2e
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}                # también (sobre todo) cuando falla: trae captura y traza
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                 # TP7: EL gate. Sin integración y e2e verdes, ni se pide aprobación
    # No repite el if de la rama y no es un olvido: la cadena arranca en deploy-qa,
    # que sí lo tiene. En un PR nada de esto corre: la condición viaja por los needs.
    environment: production                    # ⏸ acá la corrida SE PAUSA hasta que el reviewer apruebe
    concurrency:
      group: deploy-prod                       # dos deploys a PROD nunca a la vez
      cancel-in-progress: false                # (no ordena la cola de aprobaciones: la corrida vieja se rechaza a mano)
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # La MISMA imagen que QA ejecutó y verificó: el mismo sha-<commit>, ninguna
      # construcción nueva. Entre que la corrida queda esperando y que alguien
      # aprueba pueden pasar horas y main se mueve, pero esta corrida sólo puede
      # nombrar la imagen de SU commit: se despliega lo que el aprobador tuvo delante.
      - name: Desplegar en PROD la MISMA imagen que se verificó en QA (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}      # secrets del environment production:
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}  # sin aprobación no los lee ningún job
          IMG_API: ghcr.io/rous444/ingenieria-de-software-iii-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/rous444/ingenieria-de-software-iii-frontend:sha-${{ github.sha }}
        run: |
          echo "imgURL api:   $IMG_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Bajar el script del smoke test
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Smoke test de PROD (espera a que conteste la imagen de ESTE commit)
        shell: bash
        env:
          ENTORNO: production
          URL_API: ${{ vars.URL_API }}         # variables del environment production
          URL_FRONT: ${{ vars.URL_FRONT }}
          COMMIT: ${{ github.sha }}
        run: .github/scripts/smoke.sh
