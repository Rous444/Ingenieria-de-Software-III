# Mismo sistema que docker-compose.yml, pero en vez de CONSTRUIR las imágenes
# las DESCARGA del registry. Sirve para levantar todo sin tener el código.
# Cambian sólo las dos líneas donde antes decía `build:`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rodeo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/rous444/rodeo-backend:v0.1.0      # antes: build: ./backend
    environment:
      DATABASE_URL: "postgres://postgres:${DB_PASSWORD}@db:5432/rodeo"
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/rous444/rodeo-frontend:v0.1.0     # antes: build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
