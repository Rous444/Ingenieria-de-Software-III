server {
    listen 80;

    # La SPA: estáticos, con fallback a index.html para las rutas del router.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que llegue a /api se reenvía al backend por la red interna de
    # compose. Acá SÍ vale el nombre de servicio, porque quien hace el pedido es
    # nginx, que corre DENTRO de la red — no el browser, que vive en el host.
    # Y como para el browser todo sale del mismo origen, no hay CORS.
    #
    # El nombre va en una VARIABLE, no escrito directo en el proxy_pass: con el
    # nombre directo nginx lo resuelve al arrancar y, si el backend todavía no
    # existe, se niega a levantar ("host not found in upstream").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    location /api/ {
        proxy_pass $backend_api;    # SIN barra final: con barra, nginx reescribe
                                    # el prefijo y la API devuelve 404 en todo.
    }
}
